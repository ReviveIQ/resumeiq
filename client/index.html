    <!-- FAQ Structured Data (high SEO value for resume checker queries) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an ATS resume checker?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An ATS resume checker analyzes your resume for compatibility with Applicant Tracking Systems — software that filters resumes before a human reads them. ResumeIQ scores your resume on format, keywords, bullet quality, and completeness, then rewrites it to pass ATS filters."
          }
        },
        {
          "@type": "Question",
          "name": "How does ResumeIQ score my resume?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ResumeIQ uses GPT-4o to score your resume on four dimensions: ATS Format (single column, no tables), Bullet Quality (metrics and action verbs), Keyword Alignment (industry terminology), and Completeness (contact info, dates, summary). Each is scored 1-10 with a specific reason."
          }
        },
        {
          "@type": "Question",
          "name": "Is ResumeIQ free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — your first resume transformation is completely free. Create an account, upload your resume, and download your ATS-optimized Word document at no cost."
          }
        },
        {
          "@type": "Question",
          "name": "What file formats does ResumeIQ accept?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ResumeIQ accepts PDF, DOCX, and DOC files. It extracts your content, rewrites and restructures it, and delivers a clean ATS-optimized Word document."
          }
        }
      ]
    }
